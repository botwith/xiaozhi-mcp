services:
  xiaozhi-mcp:
    # 使用 ACR 镜像，而不是本地构建
    # 格式: <registry>/<namespace>/<image-name>:<tag>
    # Azure ACR 示例: <acr-name>.azurecr.io/xiaozhi-mcp:latest
    # 阿里云 ACR 示例: <registry>.cn-shanghai.aliyuncs.com/<namespace>/xiaozhi-mcp:latest
    image: ${DOCKER_REGISTRY:-crpi-lwoxnalpjm9a03w9.cn-shanghai.personal.cr.aliyuncs.com}/${DOCKER_NAMESPACE:-oj8k}/${DOCKER_IMAGE_NAME:-xiaozhi-mcp}:${DOCKER_VERSION:-latest}
    # 注意：如果镜像只有 ARM64 架构而主机是 AMD64，Docker 会尝试使用模拟运行
    # 如果模拟不可用或性能不佳，需要构建并推送 AMD64 或多架构镜像
    container_name: xiaozhi-mcp
    restart: unless-stopped
    volumes:
      # 挂载配置文件目录，方便修改配置而不需要重建镜像
      - ../mcp_config.yaml:/app/mcp_config.yaml:ro
    environment:
      TZ: Asia/Shanghai
      # 可以通过环境变量覆盖配置
      # MCP_CONFIG: /app/mcp_config.yaml
      # PYTHONUNBUFFERED: 1
    networks:
      - xiaozhi-network

networks:
  xiaozhi-network:
    driver: bridge
