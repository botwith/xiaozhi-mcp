services:
  xiaozhi-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: xiaozhi-mcp
    restart: unless-stopped
    volumes:
      # 挂载配置文件目录，方便修改配置而不需要重建镜像
      - ../mcp_config.yaml:/app/mcp_config.yaml:ro
    environment:
      # 可以通过环境变量覆盖配置
      # MCP_CONFIG: /app/mcp_config.yaml
      # PYTHONUNBUFFERED: 1
    networks:
      - xiaozhi-network

networks:
  xiaozhi-network:
    driver: bridge
