services:
  xiaozhi-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      platform: linux/amd64  # 指定平台架构，避免平台不匹配错误
    container_name: xiaozhi-mcp
    restart: unless-stopped
    volumes:
      # 挂载配置文件目录，方便修改配置而不需要重建镜像
      - ../mcp_config.yaml:/app/mcp_config.yaml:ro
      # 挂载数据目录，用于持久化存储 contacts.db 和 todos.db 等数据文件
      - ../data:/app/data
    environment:
      # 可以通过环境变量覆盖配置
      # MCP_CONFIG: /app/mcp_config.yaml
      # PYTHONUNBUFFERED: 1
    networks:
      - xiaozhi-network

networks:
  xiaozhi-network:
    driver: bridge
