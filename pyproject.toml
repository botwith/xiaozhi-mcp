[project]
name = "xiaozhi-mcp"
version = "0.1.0"
description = "A powerful interface for extending AI capabilities through remote control, calculations, email operations, knowledge search, and more."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "python-dotenv>=1.2.1",
    "websockets>=16.0",
    "mcp>=1.25.0",
    "pydantic>=2.12.5",
    "mcp-proxy>=0.11.0",
    "fastmcp>=2.14.3",
    "httpx>=0.28.1",
    "yfinance>=1.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []
